name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Select Xcode 15.4
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Install NPM Packages
      run: npm install --legacy-peer-deps

    - name: Inject Tesla Cryptographic Keys
      env:
        PRIVATE_KEY: ${{ secrets.TESLA_PRIVATE_KEY }}
        PUBLIC_KEY: ${{ secrets.TESLA_PUBLIC_KEY }}
      run: |
        mkdir -p assets
        echo "$PRIVATE_KEY" > assets/private_key.pem
        echo "$PUBLIC_KEY" > assets/public_key.pem

    - name: Expo Prebuild (Generate Native iOS Code)
      run: npx expo prebuild --platform ios --clean

    - name: Install CocoaPods Dependencies
      run: |
        cd ios
        pod install --repo-update

    - name: Compile Unsigned iOS App
      run: |
        cd ios
        xcodebuild -workspace TeslaPassiveEntry.xcworkspace -scheme TeslaPassiveEntry -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" -derivedDataPath derived_data build

    - name: Package into IPA
      run: |
        mkdir -p Payload
        cp -r ios/derived_data/Build/Products/Release-iphoneos/TeslaPassiveEntry.app Payload/
        zip -r TeslaKey.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeslaKey-iOS-App
        path: TeslaKey.ipa