name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NPM Packages
      run: npm install

    - name: Expo Prebuild (Generate Native iOS Code)
      run: npx expo prebuild --platform ios --clean

    - name: Inject Swift 6 Concurrency Bypass
      run: |
        cd ios
        ruby -i -e 'puts ARGF.read.sub("post_install do |installer|", "post_install do |installer|\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[%q(SWIFT_STRICT_CONCURRENCY)] = %q(minimal)\n    end\n  end")' Podfile

    - name: Install CocoaPods Dependencies
      run: |
        cd ios
        pod install --repo-update

    - name: Compile Unsigned iOS App
      run: |
        cd ios
        xcodebuild -workspace TeslaPassiveEntry.xcworkspace -scheme TeslaPassiveEntry -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" -derivedDataPath derived_data build

    - name: Package into IPA
      run: |
        mkdir -p Payload
        cp -r ios/derived_data/Build/Products/Release-iphoneos/TeslaPassiveEntry.app Payload/
        zip -r TeslaKey.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeslaKey-iOS-App
        path: TeslaKey.ipa