name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NPM Packages
      run: npm install

    - name: Expo Prebuild (Generate Native iOS Code)
      run: npx expo prebuild --platform ios --clean

    - name: Compile Unsigned iOS App
      run: |
        cd ios
        xcodebuild -workspace TeslaPassiveEntry.xcworkspace -scheme TeslaPassiveEntry -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" build CONFIGURATION_BUILD_DIR="$(pwd)/build"

    - name: Package into IPA
      run: |
        mkdir -p Payload
        cp -r ios/build/TeslaPassiveEntry.app Payload/
        zip -r TeslaKey.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeslaKey-iOS-App
        path: TeslaKey.ipa